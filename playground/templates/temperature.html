{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="{% static 'playground/temperature.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
</head>

<body>
<div id="container" >

<form method="Post" id="forms">
      {% csrf_token %}
 <h3 id="converter" class="top"><a href="{% url 'navigations' %}" title="go back"><</a>Temperature Converter</h3>
    <div class="row">
        <label id="entrance" for="entrances" >Enter:</label>
        <input id="entrances" name="Scales0" required type="number" step="any" placeholder="0">
    </div>

    <div class="row">
    <label for="Temperature" id="Celsius" >
        From:
    </label>
   <select id="Temperature"  name="Scales1" required>
       <option value="" selected hidden></option>
       <option value="Fahrenheit">Fahrenheit</option>
       <option value="Kelvin">Kelvin</option>
       <option value="Celsius">Celsius</option>
   </select>
    </div>

    <div class="row">
    <label for="options"  id="option"  >To:</label>
    <select id="options"  name="Scales2" required>
        <option value="" selected hidden></option>
        <option value="Fahrenheit" >Fahrenheit </option>
        <option value="Kelvin" >Kelvin</option>
        <option value="Celsius">Celsius</option>
    </select>
    </div>
    <button type="submit" id="buttons">Convert</button>
    <h2 id="results">Results: {{results}}</h2>
</form>
</div>
</body>
</html>
