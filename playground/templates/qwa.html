<!DOCTYPE html>
<html lang="en">
<head>
    <title>
        Welcome to Login Page
    </title>
</head>
<body>
    <hr>
<form method="Post">

     <label style="color:white;border: 2px solid black;background-color:red;font-size:22px;padding:4px 10px"
            for="Name" ><b>Name:</b></label>
    <input type="text" id="Name" name="Username" placeholder="Username" style="font-size:20px;border: 2px solid black;
    padding:4px 10px; width:100px;" required>
    <br>
    <br>
    <label for="Password" style="background-color:purple;color:white;border:2px solid black; padding:2px 11px;width:300px;
    font-size:20px;"><tt>Password:</tt></label>
    <input type="password" id="Password" placeholder="12323112324211" name="Password" maxlength="25" minlength="12" style="font-size:17px;border:2px solid black;width:150px;" required>
    <br>
    <br>
    <button type="submit" style="background-color:orange;color:darkred;border:2px solid black;font-size:19px" required>Submit</button>
     {% csrf_token %}
</form>



</body>
</html>
