{% load  static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>My Website</title>
    <link rel="stylesheet" href="{%  static 'playground/weight_convertor.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">


</head>
<body>


<div class="container">
      <form method="Post">
     <h1 id="convertor">Weight Convertor</h1>

    {% csrf_token %}

    <div class="row">
    <label for="number">Enter:</label>
    <input id="number" type="number" name="number" step="any" required>
    </div>
    <div class="row">
    <label for="from">From:</label>
    <select id="from" name="from" required>
        <option selected hidden></option>
        <option value="kg">Kilogram</option>
        <option value="g">Gram</option>
        <option value="mg">Milligram</option>
        <option value="t">Metric Ton</option>
        <option value="lb">Pound</option>
        <option value="oz">Ounce</option>
        <option value="st">Stone</option>
    </select>
    </div>
    <div class="row" id="tos">
    <label for="to"  >To:</label>
    <select id="to" name="to" required>
        <option selected hidden></option>
        <option value="kg">Kilogram</option>
        <option value="g">Gram</option>
        <option value="mg">Milligram</option>
        <option value="t">Metric Ton</option>
        <option value="lb">Pound</option>
        <option value="oz">Ounce</option>
        <option value="st">Stone</option>
    </select>
    </div>
    <button id="button" type="submit">Convert</button>
    <h2 id="results">Results:{{results}}{% if result %}{{units}}{% endif %}
    </h2>
</form>
</div>
</body>
</html>
